<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/data-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DataCEF: empresa AI-first de automatización e ingeniería de software. Resolvemos problemas reales de negocio con IA, desde Santiago para toda Latinoamérica." />
    <meta name="theme-color" content="#059669" />
    <title>DataCEF - Automatización Inteligente e IA</title>
    <script>
      // Aplica el tema guardado antes del primer paint (evita FOUC al recargar)
      (function () {
        var t = null
        try { t = localStorage.getItem('datacef-theme') } catch (e) { /* almacenamiento bloqueado */ }
        if (t !== 'aurora' && t !== 'nebula' && t !== 'chroma') t = 'aurora'
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
